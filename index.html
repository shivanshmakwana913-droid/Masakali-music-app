    <title>Masakali 🕊️ • Free Your Music. Fly Without Ads.</title>
    <script>
      // Clear any stale Service Workers & CacheStorage before booting Vite module scripts
      (function () {
        try {
          if ('caches' in window) {
            caches.keys().then(function (keys) {
              keys.forEach(function (k) { caches.delete(k); });
            });
          }
          if ('serviceWorker' in navigator) {
            var hadController = !!navigator.serviceWorker.controller;
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              if (regs && regs.length > 0) {
                Promise.all(regs.map(function (r) { return r.unregister(); })).then(function () {
                  if (hadController && !sessionStorage.getItem('masakali_sw_cleared')) {
                    sessionStorage.setItem('masakali_sw_cleared', '1');
                    window.location.reload();
                  }
                });
              }
            });
          }
        } catch (e) {}
      })();
    </script>
